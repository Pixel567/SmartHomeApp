<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" >
<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        img {
          width: 70px;
        }
        #logo {
            width: 100%;
        }
        p {
            margin-bottom: 0;
        }



        html, body{
          height: 100%;
          width:100%;
          font-size: 30px;
          position: absolute;
          margin: 0;
          background-color: #273140;
          color: #c2d3ed;
          font-family: arial, sans-serif;
        }
        .sidebar {
          height: 100%;
          width: 10%;
          margin: 0;
          background-color: #435570;
          position: absolute;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          align-items: center;
          padding-bottom: 1%;
        }
        .data {
          left: 25%;
          right: 15%;
          height: 30%;
          top: 3%;
          position: absolute;
          background-color: #435570;
          border-radius: 7px;
          box-shadow: 8px 8px 8px #12171f;

          display: flex;
          flex-direction: row;
          justify-content: space-between;
          align-items: center;
          padding: 0 5%;
        }


        .inline1 {
          margin: 0px;
          padding: 0px;
          display: flex;
          flex-direction: row;
          justify-content: center;
          align-items: center;
        }
        .light {
          left: 25%;
          right: 50%;
          height: 20%;
          top: 36%;
          background-color: #435570;
          position: absolute;
          border-radius: 7px;
          box-shadow: 8px 8px 8px #12171f;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          gap: 15%;
        }

        .lock {
          left: 25%;
          right: 50%;
          height: 38%;
          top: 59%;
          width: 11.5%;
          background-color: #435570;
          position: absolute;
          border-radius: 7px;
          box-shadow: 8px 8px 8px #12171f;
          display:flex;
          flex-direction: column;
          justify-content: space-around;
          align-items: center;

        }

        .code {
          left: 38.5%;
          right: 50%;
          width: 11.5%;
          height: 38%;
          top: 59%;
          background-color: #435570;
          position: absolute;
          border-radius: 7px;
          box-shadow: 8px 8px 8px #12171f;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: space-around;
        }


        input{
            width: 75%;
        }

        button{
            background-color: #273140;
            border: 7px solid #273140;
            color: #c2d3ed;
        }


    </style>
</head>
<body>
<div class="sidebar">
    <img id="logo" src="/img/smarthome.png">
    <div style="margin: 5%; font-color: white">
        <a id="user_username">null</a>
        <a href="/logout"><button onclick="/logout" >Sign out</button></a>
    </div>
</div>


<div class="data">
    <div class="inline1">
        <img src="/img/temperature.png">
        <p id='temperature'>null</p>
        <p>°C</p>
    </div>
    <div class="inline1">
        <img src="/img/moisture.png">
        <p id='humidity'>null</p>
        <p>%</p>
    </div>
    <div class="inline1">
        <img src="/img/motion.png">
        <p id='motion'>null</p>
    </div>
</div>


<div class="lock" >
    <img id="lockPicture" src="/img/lock_opened.png">
    <div class="form-check form-switch" style="display: flex; justify-content: center">
        <input class="form-check-input" type="checkbox" id="lockSwitch">
    </div>
</div>


<div class="light">
    <img src="/img/lightbulb.png">
    <input id="lightSlider" type="range" min="0" max="100" value="50">
</div>


<div class="code">
    <a style="font-size: 20px; text-align:center">Enter new 4-digit code:</a>
    <input type="password" style="border-radius:7px; background-color: #">
</div>

<div class="chart"></div>
<script th:src="@{/js/light.js}"></script>
<script th:src="@{/js/data.js}"></script>
<script th:src="@{/js/lock.js}"></script>
</body>
</html>
